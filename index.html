.eg{display:block;width:100%;aspect-ratio:var(--ar);background:currentColor;-webkit-mask:var(--eagle) center/contain no-repeat;mask:var(--eagle) center/contain no-repeat}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--font-body);
  color:var(--cream);
  background:
    radial-gradient(circle at 15% 8%, rgba(214,32,43,.45), transparent 42%),
    radial-gradient(circle at 88% 92%, rgba(214,32,43,.38), transparent 46%),
    repeating-linear-gradient(45deg, rgba(255,243,227,.045) 0 2px, transparent 2px 34px),
    repeating-linear-gradient(-45deg, rgba(255,243,227,.045) 0 2px, transparent 2px 34px),
    var(--black);
  background-attachment:fixed;
  overflow-x:hidden;
}
.kilim{
  height:16px;width:100%;position:fixed;left:0;z-index:5;
  background:
    linear-gradient(135deg,var(--red) 25%,transparent 25%) -8px 0/16px 16px,
    linear-gradient(225deg,var(--red) 25%,transparent 25%) -8px 0/16px 16px,
    linear-gradient(315deg,var(--red) 25%,transparent 25%) 0 0/16px 16px,
    linear-gradient(45deg,var(--red) 25%,transparent 25%) 0 0/16px 16px,
    #000;
}
.kilim.top{top:0}.kilim.bottom{bottom:0}
.watermark{--gap:var(--red);position:fixed;right:-6vmin;bottom:-4vmin;width:78vmin;height:78vmin;color:var(--red);opacity:.09;pointer-events:none;animation:drift 9s ease-in-out infinite}
.watermark .eg{width:100%;height:100%;aspect-ratio:auto}
@keyframes drift{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
main{position:relative;z-index:2;max-width:820px;margin:0 auto;padding:40px 16px 56px}
.mute{position:fixed;top:26px;right:14px;z-index:20;width:46px;height:46px;border-radius:50%;border:3px solid var(--cream);background:var(--black);color:var(--cream);font:700 20px var(--font-body);cursor:pointer}
.mute[aria-pressed="true"]{background:var(--red-deep);text-decoration:line-through}
button{font-family:inherit}
:focus-visible{outline:4px solid var(--gold);outline-offset:3px}

/* ---------- start ---------- */
.hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:8px}
.flag{--gap:var(--red);width:min(300px,70vw);aspect-ratio:7/5;background:var(--red);border:4px solid var(--cream);border-radius:6px;display:grid;place-items:center;color:var(--black);box-shadow:0 18px 40px rgba(0,0,0,.55);animation:wave 3.2s ease-in-out infinite;position:relative;overflow:hidden;transform-origin:left center}
.flag img{display:block;width:100%;height:100%;object-fit:cover}
.flag::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.22) 45%,transparent 65%);background-size:200% 100%;animation:sheen 3.2s ease-in-out infinite}
@keyframes wave{0%,100%{transform:perspective(700px) rotateY(-9deg) skewY(1.2deg)}50%{transform:perspective(700px) rotateY(7deg) skewY(-1.2deg)}}
@keyframes sheen{0%{background-position:160% 0}100%{background-position:-60% 0}}
.date{font:400 14px var(--font-body);letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
h1{font:400 clamp(34px,8vw,64px)/1.02 var(--font-display);margin:0;text-wrap:balance;text-shadow:4px 4px 0 var(--red)}
.lede{max-width:46ch;font-size:19px;line-height:1.4;margin:0;color:#f3dfd0}
.namebox{display:flex;flex-direction:column;gap:6px;width:min(380px,100%);text-align:left}
.namebox label{font-weight:600;font-size:15px;color:var(--gold)}
.namebox input{font:500 20px var(--font-body);padding:12px 16px;border-radius:14px;border:3px solid var(--cream);background:var(--black);color:var(--cream)}
.namebox input::placeholder{color:#a88f88}
.btn{font:600 22px var(--font-body);padding:14px 34px;border-radius:999px;border:4px solid var(--black);background:var(--red);color:#fff;cursor:pointer;box-shadow:0 6px 0 var(--black),0 0 0 3px var(--cream);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--black),0 0 0 3px var(--cream)}
.rules{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:0;padding:0;list-style:none;font-size:15px;color:#f3dfd0}
.rules li{border:2px dashed rgba(255,243,227,.4);border-radius:999px;padding:6px 14px}

/* ---------- quiz ---------- */
.hud{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:600;font-size:18px;margin-bottom:10px;padding-right:56px}
.pts{background:var(--cream);color:var(--black);border-radius:999px;padding:4px 16px;border:3px solid var(--black);box-shadow:3px 3px 0 var(--red)}
.pts b{font-variant-numeric:tabular-nums}
.segs{display:grid;grid-template-columns:repeat(30,1fr);gap:3px;margin-bottom:20px}
.segs span{height:10px;border-radius:3px;background:rgba(255,243,227,.18);transition:background .3s,transform .3s}
.segs span.cur{background:var(--gold);transform:scaleY(1.5)}
.segs span.ok{background:var(--good)}
.segs span.bad{background:var(--red)}
.card{background:var(--cream);color:var(--black);border:5px solid var(--black);border-radius:22px;box-shadow:10px 10px 0 var(--red);padding:22px 20px 20px;position:relative;animation:pop .35s ease-out}
@keyframes pop{from{transform:translateY(14px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.card.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-12px) rotate(-.6deg)}35%{transform:translateX(10px) rotate(.5deg)}55%{transform:translateX(-7px)}75%{transform:translateX(5px)}}
.card.glow{animation:glow .7s}
@keyframes glow{0%{box-shadow:10px 10px 0 var(--red)}40%{box-shadow:10px 10px 0 var(--good),0 0 50px var(--good)}100%{box-shadow:10px 10px 0 var(--red)}}
.coach{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.mascot{--gap:var(--black);flex:none;width:62px;height:62px;border-radius:50%;background:var(--black);color:var(--red);border:4px solid var(--red);display:grid;place-items:center;transition:transform .2s}
.mascot .eg{width:44px}
.mascot.happy{animation:hop .7s}
.mascot.sad{animation:droop 1s forwards}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-18px) scale(1.15) rotate(-8deg)}60%{transform:translateY(0) scale(.95)}80%{transform:translateY(-6px) rotate(6deg)}}
@keyframes droop{0%{transform:rotate(0)}40%{transform:rotate(-14deg) translateY(4px)}100%{transform:rotate(-8deg) translateY(2px)}}
.bubble{background:var(--black);color:var(--cream);border-radius:16px;padding:8px 14px;font-weight:600;font-size:17px;position:relative}
.bubble::before{content:"";position:absolute;left:-9px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:var(--black);border-left:0}
h2{font:400 clamp(22px,4.6vw,30px)/1.2 var(--font-display);margin:0 0 18px;text-wrap:balance}
.qno{display:inline-block;background:var(--red);color:#fff;font:600 14px var(--font-body);border-radius:8px;padding:2px 10px;margin-bottom:8px;letter-spacing:.08em}
.opts{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;text-align:left;font:500 19px/1.2 var(--font-body);color:var(--black);background:#fff;border:4px solid var(--black);border-radius:16px;padding:12px 14px;min-height:64px;cursor:pointer;transition:transform .12s,background .15s,box-shadow .12s;box-shadow:0 5px 0 var(--black)}
.opt:hover:not(:disabled){transform:translateY(-3px);background:#ffe6dd;box-shadow:0 8px 0 var(--red)}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--black)}
.opt .k{flex:none;width:34px;height:34px;border-radius:50%;background:var(--black);color:var(--cream);display:grid;place-items:center;font-weight:700;font-size:17px}
.opt:disabled{cursor:default}
.opt.right{background:var(--good);color:#fff;border-color:#0b5c32;animation:bounce .6s}
.opt.right .k{background:#fff;color:var(--good)}
.opt.wrong{background:var(--black);color:var(--cream);border-color:var(--red);animation:wiggle .5s}
.opt.wrong .k{background:var(--red)}
.opt.dim{opacity:.5}
@keyframes bounce{0%,100%{transform:scale(1)}40%{transform:scale(1.06)}70%{transform:scale(.98)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
.fb{margin-top:16px;border-radius:16px;padding:14px 16px;background:#fff0d6;border:3px dashed var(--black);display:none}
.fb.on{display:block;animation:pop .3s ease-out}
.fb h3{margin:0 0 4px;font:400 22px var(--font-display)}
.fb.ok h3{color:#0b7a42}.fb.no h3{color:var(--red-deep)}
.fb p{margin:0 0 12px;font-size:18px;line-height:1.4}
.fb .btn{font-size:19px;padding:10px 26px}
.plus{position:fixed;z-index:60;font:400 34px var(--font-display);color:var(--gold);text-shadow:3px 3px 0 var(--black);pointer-events:none;animation:rise 1s ease-out forwards}
@keyframes rise{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-90px) scale(1.3);opacity:0}}

/* ---------- end ---------- */
.end{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.medal{--gap:var(--red);width:150px;height:150px;border-radius:50%;background:var(--red);border:7px solid var(--cream);color:var(--black);display:grid;place-items:center;box-shadow:0 0 0 6px var(--black),0 0 60px rgba(214,32,43,.7);animation:spin-in .9s cubic-bezier(.2,1.4,.4,1)}
.medal .eg{width:100px}
@keyframes spin-in{from{transform:rotate(-200deg) scale(.2);opacity:0}to{transform:none;opacity:1}}
.bigscore{font:400 clamp(60px,16vw,110px)/1 var(--font-display);text-shadow:5px 5px 0 var(--red);font-variant-numeric:tabular-nums}
.bigscore small{font-size:.45em;color:var(--gold);text-shadow:none}
.stars{display:flex;gap:6px}
.stars svg{width:46px;height:46px}
.stars .on{animation:starin .5s both}
@keyframes starin{from{transform:scale(0) rotate(-90deg)}to{transform:scale(1) rotate(0)}}
.verdict{max-width:34ch;font-size:22px;line-height:1.3;margin:0;font-weight:500}
.stats{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.stats div{background:var(--cream);color:var(--black);border:3px solid var(--black);border-radius:14px;padding:8px 16px;box-shadow:4px 4px 0 var(--red);font-weight:600}
@media (max-width:620px){
  .opts{grid-template-columns:1fr}
  .opt{font-size:18px}
  .card{box-shadow:7px 7px 0 var(--red)}
  .segs{gap:2px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

{q:"Çfarë festojmë në Shqipëri më 28 Nëntor?",o:["Ditën e Pavarësisë","Ditën e Verës","Vitin e Ri","Ditën e Mësuesit"],f:"28 Nëntori është festa më e madhe kombëtare. Në këtë ditë Shqipëria u shpall shtet i pavarur."},
{q:"Në cilin vit u shpall Pavarësia e Shqipërisë?",o:["1912","1944","1990","2008"],f:"Pavarësia u shpall në vitin 1912, pas rreth pesë shekujsh nën sundimin e Perandorisë Osmane."},
{q:"Në cilin qytet u shpall Pavarësia?",o:["Vlorë","Tiranë","Shkodër","Durrës"],f:"Në Vlorë u mblodhën delegatë nga shumë krahina të Shqipërisë dhe e shpallën Pavarësinë."},
{q:"Kush e shpalli Pavarësinë e Shqipërisë?",o:["Ismail Qemali","Skënderbeu","Nënë Tereza","Naim Frashëri"],f:"Ismail Qemali, i lindur në Vlorë, e shpalli Pavarësinë dhe u bë kryeministri i parë i Shqipërisë."},
{q:"Çfarë ngjyrash ka flamuri ynë?",o:["Të kuqe dhe të zeza","Blu dhe të bardha","Jeshile dhe të verdha","Të kuqe dhe të bardha"],f:"Flamuri ynë ka sfond të kuq dhe një shqiponjë të zezë. Prandaj i duam kaq shumë ngjyrat kuq e zi!"},
{q:"Çfarë shohim në mes të flamurit tonë?",o:["Shqiponjë dykrenore","Një yll","Një gjysmëhënë","Një luan"],f:"Shqiponja dykrenore është simboli i shqiptarëve që prej shumë shekujsh."},
{q:"Sa koka ka shqiponja në flamurin tonë?",o:["Dy","Një","Tri","Katër"],f:"Shqiponja ka dy koka dhe shikon në dy anët, si një roje e kujdesshme e vendit."},
{q:"Çfarë do të thotë fjala “Shqipëri”, sipas shpjegimit më të njohur?",o:["Vendi i shqiponjave","Vendi i maleve","Vendi i detit","Vendi i diellit"],f:"Shqiptarët e quajnë vendin e tyre Shqipëri, domethënë vendi i shqiponjave. Edhe shqiponja në flamur na e kujton këtë."},
{q:"Cili është kryeqyteti i Shqipërisë?",o:["Tirana","Vlora","Korça","Shkodra"],f:"Tirana është kryeqyteti. Aty ndodhet Kuvendi dhe aty mbahen ceremonitë kryesore të festës."},
{q:"Sipas historisë, kush e qepi flamurin që u ngrit në Vlorë më 1912?",o:["Marigo Posio","Nënë Tereza","Shote Galica","Mrika"],f:"Flamurin e qepi Marigo Posio, një grua vlonjate. Ai u ngrit në ballkonin e shtëpisë ku u shpall Pavarësia."},
{q:"Kush e ngriti flamurin kuq e zi në Krujë më 28 Nëntor 1443?",o:["Skënderbeu","Ismail Qemali","Ahmet Zogu","Nënë Tereza"],f:"Skënderbeu e çliroi Krujën dhe ngriti flamurin. Për këtë arsye 28 Nëntori quhet edhe Dita e Flamurit."},
{q:"Cili është emri i vërtetë i Skënderbeut?",o:["Gjergj Kastrioti","Gjergj Fishta","Gjon Buzuku","Pjetër Bogdani"],f:"Emri i tij ishte Gjergj Kastrioti. Njerëzit e quajtën Skënderbe, që do të thotë Zoti Aleksandër."},
{q:"Çfarë kishte Skënderbeu në përkrenaren e tij?",o:["Një kokë dhie","Një kokë luani","Një pendë shqiponje","Një kurorë"],f:"Përkrenarja e Skënderbeut kishte një kokë dhie. Sot ajo ruhet në një muze në Vjenë."},
{q:"Cilit shtet i përkiste Shqipëria para vitit 1912?",o:["Perandorisë Osmane","Italisë","Greqisë","Austrisë"],f:"Për shumë shekuj Shqipëria ishte pjesë e Perandorisë Osmane. Në 1912 shqiptarët vendosën të bëheshin shtet më vete."},
{q:"Sa vjet mbushen këtë 28 Nëntor nga Pavarësia (viti 2026)?",o:["114 vjet","100 vjet","110 vjet","120 vjet"],f:"Nga viti 1912 deri në 2026 janë 114 vjet. Çdo vit kjo festë bëhet edhe një vit më e vjetër!"},
{q:"Si quhet himni kombëtar i Shqipërisë?",o:["Himni i Flamurit","Himni i Vlorës","Himni i Kuq e Zi","Himni i Pavarësisë"],f:"Himni i Flamurit ka tekst nga poeti Asdreni. Këndohet kur ngrihet flamuri në festa."},
{q:"Si e urojmë njëri-tjetrin më 28 Nëntor?",o:["Gëzuar Ditën e Flamurit!","Gëzuar Vitin e Ri!","Gëzuar Pashkët!","Gëzuar ditëlindjen!"],f:"Urimi i zakonshëm është “Gëzuar Ditën e Flamurit!” ose “Gëzuar Pavarësinë!”. Mund t’i urosh miqtë, mësuesit dhe fqinjët."},
{q:"Çfarë bëjnë shumë njerëz në festën e 28 Nëntorit?",o:["Ngrenë flamuj dhe këndojnë këngë patriotike","Zbukurojnë pemën e Vitit të Ri","Kërkojnë vezë të ngjyrosura","Hedhin ujë mbi njëri-tjetrin"],f:"Njerëzit vendosin flamuj në shtëpi e në shkolla, mbajnë koncerte, dhe shumë vishen me të kuqe dhe të zezë."},
{q:"Vlora ndodhet buzë detit. Cilit det?",o:["Adriatik dhe Jon","Detit të Zi","Detit të Kuq","Detit Baltik"],f:"Në Gjirin e Vlorës takohen dy male uji: deti Adriatik dhe deti Jon."},
{q:"Cili vend NUK kufizohet me Shqipërinë?",o:["Italia","Greqia","Mali i Zi","Kosova"],f:"Shqipëria kufizohet me Malin e Zi, Kosovën, Maqedoninë e Veriut dhe Greqinë. Italia është matanë detit Adriatik."},
{q:"Në cilin vit u çlirua Shqipëria nga pushtuesit gjermanë, pas Luftës së Dytë Botërore?",o:["1944","1912","1939","1990"],f:"Më 29 Nëntor 1944 Tirana u çlirua. Kjo datë shënohet si Dita e Çlirimit."},
{q:"Cilat dy data festohen në fund të nëntorit në Shqipëri?",o:["28 dhe 29","1 dhe 2","10 dhe 11","20 dhe 21"],f:"28 Nëntori është Dita e Pavarësisë, ndërsa 29 Nëntori është Dita e Çlirimit. Ato janë dy ditë pushimi radhazi."},
{q:"Nëntori është muaji i sa-të i vitit?",o:["I 11-ti","I 9-ti","I 10-ti","I 12-ti"],f:"Nëntori është muaji i 11-të. Emri vjen nga latinishtja ku “novem” do të thotë nëntë, sepse dikur viti fillonte në mars."},
{q:"Cila pjatë konsiderohet ndër ushqimet më të njohura kombëtare të shqiptarëve?",o:["Tavë kosi","Sushi","Hamburger","Pica"],f:"Tavë kosi përgatitet me mish qengji, oriz dhe kos. Shumë familje e gatuajnë për festat e mëdha."},
{q:"Sa shkronja ka alfabeti i gjuhës shqipe?",o:["36","26","30","40"],f:"Alfabeti shqip ka 36 shkronja, midis tyre edhe Ë dhe Ç. Shumë prej tyre shkruhen me dy shkronja, si Sh, Gj, Dh dhe Xh."},
{q:"Cila nga këto është shkronjë e alfabetit shqip?",o:["Rr","W","Ñ","Å"],f:"Rr është shkronjë më vete në shqip. Shkronjat W, Ñ e Å nuk i përdorim në alfabetin tonë."},
{q:"Çfarë shohim shpesh në qiell në mbrëmjen e festës në qytete?",o:["Fishekzjarre","Bora","Eklips","Rrufe"],f:"Në shumë qytete, sidomos në Vlorë dhe Tiranë, festa mbyllet me fishekzjarre shumëngjyrëshe."},
{q:"Në cilin shesh të Tiranës ndodhet përmendorja e Skënderbeut me kalë?",o:["Sheshi Skënderbej","Sheshi Vlora","Sheshi Kuq e Zi","Sheshi Çlirimi"],f:"Në Sheshin Skënderbej, në zemër të Tiranës, qëndron përmendorja e heroit tonë kombëtar mbi kalë."},
{q:"Kush tjetër e feston më 28 Nëntor Ditën e Flamurit?",o:["Shqiptarët në Kosovë dhe kudo në botë","Vetëm italianët","Vetëm grekët","Askush tjetër"],f:"Flamuri na bashkon. Shqiptarët në Kosovë, Maqedoninë e Veriut, Malin e Zi dhe në mërgatë e festojnë këtë ditë me shumë gëzim."},
{q:"Çfarë përfaqëson flamuri kuq e zi për shqiptarët?",o:["Lirinë dhe krenarinë kombëtare","Një lojë me letra","Një shenjë trafiku","Një emër ushqimi"],f:"Flamuri është simboli i lirisë, i bashkimit dhe i krenarisë sonë. Urime për të gjithë ata që e donë atë!"}
];

  return ac;
}
function note(f,t0,d,type,v){
  var c=audio();if(!c||muted)return;
  var t=c.currentTime+t0,o=c.createOscillator(),g=c.createGain();
  o.type=type||'triangle';o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05);
}
var sfx={
  tick:function(){note(660,0,.05,'square',.04)},
  right:function(){[523,659,784,1047].forEach(function(f,i){note(f,i*.09,.22,'triangle',.2)});note(1319,.38,.4,'sine',.14);note(2093,.46,.3,'sine',.06)},
  wrong:function(){note(311,0,.28,'sine',.2);note(247,.22,.5,'sine',.2);note(196,.46,.55,'sine',.12)},
  start:function(){[392,523,659].forEach(function(f,i){note(f,i*.1,.25,'triangle',.18)})},
  win:function(){
    var m=[[523,0,.14],[523,.15,.14],[523,.3,.14],[659,.45,.3],[587,.78,.14],[659,.93,.14],[784,1.08,.5],[659,1.6,.18],[784,1.8,.18],[1047,2,.9]];
    m.forEach(function(n){note(n[0],n[1],n[2],'triangle',.2);note(n[0]/2,n[1],n[2],'sine',.1)});
  },
  ok:function(){[392,440,523,587].forEach(function(f,i){note(f,i*.18,.3,'triangle',.18)})},
  low:function(){[392,440,523].forEach(function(f,i){note(f,i*.22,.35,'sine',.18)})}
};
var muteBtn=$('#mute');
muteBtn.addEventListener('click',function(){
  muted=!muted;muteBtn.setAttribute('aria-pressed',muted);
  muteBtn.setAttribute('aria-label',muted?'Hap zërin':'Fik zërin');
  if(!muted){audio();sfx.tick()}
});

/* ---------- konfeti dhe flokë (canvas) ---------- */
var cv=$('#fx'),cx=cv.getContext('2d'),parts=[],raf=0;
function fit(){cv.width=innerWidth;cv.height=innerHeight}
fit();addEventListener('resize',fit);
function burst(x,y,n){
  if(RM)n=Math.ceil(n/5);
  var cols=['#D6202B','#0D0A0B','#FFF3E3','#FFC93C','#ff5b64'];
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2,s=4+Math.random()*10;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,g:.28,w:6+Math.random()*8,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:pick(cols),life:110+Math.random()*60,shape:'r'});
  }
  go();
}
function rainConfetti(n){
  if(RM)n=Math.ceil(n/5);
  var cols=['#D6202B','#0D0A0B','#FFF3E3','#FFC93C'];
  for(var i=0;i<n;i++){
    parts.push({x:Math.random()*cv.width,y:-20-Math.random()*200,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,g:.02,w:7+Math.random()*7,h:5+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:pick(cols),life:400,shape:'r'});
  }
  go();
}
function flakes(n){
  if(RM)return;
  var cols=['#0D0A0B','#3a2a2c','#7F0C14','#6b5b5e'];
  for(var i=0;i<n;i++){
    parts.push({x:Math.random()*cv.width,y:-10-Math.random()*120,vx:(Math.random()-.5)*1.2,vy:1.5+Math.random()*2.5,g:.02,w:5+Math.random()*7,h:0,r:0,vr:0,c:pick(cols),life:300,shape:'c'});
  }
  go();
}
function go(){if(!raf)raf=requestAnimationFrame(tick)}
function tick(){
  raf=0;cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(function(p){
    p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;p.vx*=.99;
    if(p.life<=0||p.y>cv.height+30)return false;
    cx.save();cx.globalAlpha=Math.min(1,p.life/40);cx.translate(p.x,p.y);cx.fillStyle=p.c;
    if(p.shape==='c'){cx.beginPath();cx.arc(0,0,p.w/2,0,7);cx.fill()}
    else{cx.rotate(p.r);cx.fillRect(-p.w/2,-p.h/2,p.w,p.h)}
    cx.restore();return true;
  });
  if(parts.length)go();
}
function floatText(text,el){
  var r=el.getBoundingClientRect(),d=document.createElement('div');
  d.className='plus';d.textContent=text;d.style.left=(r.left+r.width/2-30)+'px';d.style.top=(r.top)+'px';
  document.body.appendChild(d);setTimeout(function(){d.remove()},1000);
}

/* ---------- gjendja ---------- */
var S={name:'',order:[],i:0,score:0,streak:0,best:0,answered:false,res:[],timers:[]};
function later(fn,ms){var t=setTimeout(fn,ms);S.timers.push(t)}
function clearTimers(){S.timers.forEach(clearTimeout);S.timers=[]}

/* ---------- ekrani i parë ---------- */
function showStart(){
  clearTimers();
  app.innerHTML=
  '<section class="hero">'+
    '<div class="flag">'+FLAG+'</div>'+
    '<div class="date">28 Nëntor 1912 · Vlorë</div>'+
    '<h1>Kuizi i Pavarësisë</h1>'+
    '<p class="lede">30 pyetje për festën e flamurit kuq e zi. Zgjidh përgjigjen e saktë dhe mëso diçka të re pas çdo pyetjeje.</p>'+
    '<div class="namebox"><label for="nm">Si quhesh? (nuk është e detyrueshme)</label><input id="nm" type="text" maxlength="20" autocomplete="off" placeholder="Shkruaj emrin këtu"></div>'+
    '<button id="go" class="btn" type="button">Fillo kuizin</button>'+
    '<ul class="rules"><li>1 përgjigje e saktë = 1 pikë</li><li>Mund të shtypësh 1, 2, 3 ose 4</li><li>Ke tinguj dhe lojë</li></ul>'+
  '</section>';
  $('#go').addEventListener('click',begin);
  $('#nm').addEventListener('keydown',function(e){if(e.key==='Enter')begin()});
}
function begin(){
  S.name=($('#nm').value||'').trim();
  S.order=Q.map(function(_,i){return i});
  S.i=0;S.score=0;S.streak=0;S.best=0;S.res=[];
  audio();sfx.start();
  var b=$('#go').getBoundingClientRect();burst(b.left+b.width/2,b.top+b.height/2,50);
  showQ();
}

/* ---------- pyetja ---------- */
function showQ(){
  clearTimers();
  S.answered=false;
  var item=Q[S.order[S.i]];
  var opts=shuffle(item.o.map(function(t,k){return {t:t,ok:k===0}}));
  S.cur={item:item,opts:opts};
  var segs='';
  for(var k=0;k<Q.length;k++){segs+='<span class="'+(k<S.i?(S.res[k]?'ok':'bad'):(k===S.i?'cur':''))+'"></span>'}
  var L=['A','B','C','D'];
  app.innerHTML=
  '<div class="hud"><span>Pyetja <b>'+(S.i+1)+'</b> / '+Q.length+'</span><span class="pts">Pikë: <b id="pts">'+S.score+'</b></span></div>'+
  '<div class="segs" aria-hidden="true">'+segs+'</div>'+
  '<section class="card" id="card">'+
    '<div class="coach"><div class="mascot" id="mas">'+EAGLE+'</div><div class="bubble" id="bub" aria-live="polite">'+(S.i===0&&S.name?esc(S.name)+', fillojmë!':'Gjej përgjigjen e saktë!')+'</div></div>'+
    '<span class="qno">PYETJA '+(S.i+1)+'</span>'+
    '<h2>'+esc(item.q)+'</h2>'+
    '<div class="opts" id="opts">'+opts.map(function(o,k){return '<button type="button" class="opt" data-k="'+k+'"><span class="k">'+L[k]+'</span><span>'+esc(o.t)+'</span></button>'}).join('')+'</div>'+
    '<div class="fb" id="fb" role="status"></div>'+
  '</section>';
  Array.prototype.forEach.call(app.querySelectorAll('.opt'),function(b){
    b.addEventListener('click',function(){choose(+b.getAttribute('data-k'))});
  });
  window.scrollTo({top:0,behavior:RM?'auto':'smooth'});
}
function choose(k){
  if(S.answered)return;S.answered=true;
  var c=S.cur,sel=c.opts[k],btns=app.querySelectorAll('.opt'),card=$('#card'),mas=$('#mas'),bub=$('#bub');
  Array.prototype.forEach.call(btns,function(b,j){
    b.disabled=true;
    if(c.opts[j].ok)b.classList.add('right');
    else if(j===k)b.classList.add('wrong');
    else b.classList.add('dim');
  });
  var fb=$('#fb'),last=S.i===Q.length-1;
  S.res[S.i]=sel.ok;
  var r=btns[k].getBoundingClientRect();
  if(sel.ok){
    S.score++;S.streak++;if(S.streak>S.best)S.best=S.streak;
    $('#pts').textContent=S.score;
    sfx.right();burst(r.left+r.width/2,r.top+r.height/2,90);
    card.classList.add('glow');mas.classList.add('happy');
    floatText('+1',btns[k]);
    var msg=pick(OK);if(S.streak>=3&&S.streak%2===1)msg='Seri '+S.streak+' radhazi!';
    bub.textContent=msg;
    fb.className='fb on ok';
    fb.innerHTML='<h3>Saktë!</h3><p><b>A e dije?</b> '+esc(c.item.f)+'</p>';
  }else{
    S.streak=0;
    sfx.wrong();flakes(45);
    card.classList.add('shake');mas.classList.add('sad');
    bub.textContent=pick(NO);
    fb.className='fb on no';
    var right=c.opts.filter(function(o){return o.ok})[0].t;
    fb.innerHTML='<h3>Pothuajse!</h3><p>Përgjigjja e saktë është: <b>'+esc(right)+'</b>.</p><p><b>A e dije?</b> '+esc(c.item.f)+'</p>';
  }
  var nb=document.createElement('button');nb.type='button';nb.className='btn';nb.id='nx';
  nb.textContent=last?'Shiko rezultatin':'Pyetja tjetër →';
  nb.addEventListener('click',function(){sfx.tick();if(last)showEnd();else{S.i++;showQ()}});
  fb.appendChild(nb);
  later(function(){nb.focus({preventScroll:true});fb.scrollIntoView({block:'nearest',behavior:RM?'auto':'smooth'})},350);
}
document.addEventListener('keydown',function(e){
  if(!app.querySelector('#opts')||S.answered)return;
  var n=parseInt(e.key,10);
  if(n>=1&&n<=4)choose(n-1);
});

/* ---------- rezultati ---------- */
function showEnd(){
  clearTimers();
  var n=S.score,tot=Q.length,stars=Math.round(n/tot*5);
  var title,txt;
  if(n>=27){title='Shqiponjë e vërtetë!';txt='Je kampion i Pavarësisë. Di pothuajse gjithçka për flamurin tonë!'}
  else if(n>=21){title='Shkëlqyeshëm!';txt='Njeh shumë mirë historinë e 28 Nëntorit. Edhe pak dhe bëhesh kampion.'}
  else if(n>=15){title='Të lumtë!';txt='Je në rrugë të mirë. Provo përsëri dhe do t’i gjesh edhe përgjigjet që të ikën.'}
  else{title='Fillim i mirë!';txt='Tani i di disa fakte të reja. Luaj edhe një herë dhe shiko sa pikë shton.'}
  var nm=S.name?(esc(S.name)+', '):'';
  var starSvg='';
  for(var s=0;s<5;s++){
    starSvg+='<svg class="'+(s<stars?'on':'')+'" style="animation-delay:'+(1.2+s*.25)+'s;'+(s<stars?'':'opacity:.3')+'" fill="'+(s<stars?'#FFC93C':'#fff3e3')+'" stroke="#0D0A0B" stroke-width="1.2" aria-hidden="true"><use href="#star"/></svg>';
  }
  app.innerHTML=
  '<section class="end">'+
    '<div class="medal" aria-hidden="true">'+EAGLE+'</div>'+
    '<div class="date">Kuizi përfundoi</div>'+
    '<h1>'+nm+esc(title)+'</h1>'+
    '<div class="bigscore" aria-live="polite"><span id="cnt">0</span><small> / '+tot+'</small></div>'+
    '<div class="stars" role="img" aria-label="'+stars+' yje nga 5">'+starSvg+'</div>'+
    '<p class="verdict">'+esc(txt)+'</p>'+
    '<div class="stats"><div>Të sakta: '+n+'</div><div>Të pasakta: '+(tot-n)+'</div><div>Seria më e gjatë: '+S.best+'</div></div>'+
    '<button id="again" class="btn" type="button">Luaj përsëri</button>'+
  '</section>';
  $('#again').addEventListener('click',function(){sfx.tick();showStart()});
  window.scrollTo(0,0);
  var c=0,el=$('#cnt');
  if(n===0){el.textContent='0'}
  else{
    var iv=setInterval(function(){c++;el.textContent=c;sfx.tick();if(c>=n)clearInterval(iv)},Math.max(40,Math.min(110,1400/n)));
    S.timers.push(iv);
  }
  var d=Math.max(1000,n*(Math.max(40,Math.min(110,1400/Math.max(n,1)))));
  later(function(){
    if(n>=15){
      sfx.win();
      burst(innerWidth*.25,innerHeight*.45,110);burst(innerWidth*.75,innerHeight*.45,110);rainConfetti(120);
      for(var k=1;k<=5;k++){(function(k){later(function(){burst(Math.random()*innerWidth,Math.random()*innerHeight*.6+40,70);if(k%2)rainConfetti(50)},k*700)})(k)}
    }else if(n>=8){sfx.ok();rainConfetti(60)}
    else{sfx.low();flakes(30)}
  },d+150);
}

showStart();
})();
</script>
</body>
</html>
